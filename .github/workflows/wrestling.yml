name: Agente Wrestling

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      solo_prova:
        description: "Solo prova (non scrive su Notion)"
        type: boolean
        default: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -u scrape_wrestling.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRY_RUN: ${{ github.event.inputs.solo_prova }}
